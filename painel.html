<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel - AutoEscala - ACPM</title>
<meta name="application-name" content="AutoEscala - ACPM">
<meta name="description" content="Painel de partidas e chegadas do Aeroclube de Pará de Minas, para a TV da recepção.">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<!-- TV da recepção (js/painel.js): o painel de partidas e chegadas de hoje na tela toda, como nos aeroportos -->
<body class="tela-painel">
<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <symbol id="i-decolagem" viewBox="0 0 24 24"><path d="M2 22h20"/><path d="M6.36 17.4 4 17l-2-4 1.1-.55a2 2 0 0 1 1.8 0l.17.1a2 2 0 0 0 1.8 0L8 12 5 6l.9-.45a2 2 0 0 1 2.09.2l4.02 3a2 2 0 0 0 2.1.2l4.19-2.06a2.41 2.41 0 0 1 1.73-.17L21 7a1.4 1.4 0 0 1 .87 1.99l-.38.76c-.23.46-.6.84-1.07 1.08L7.58 17.2a2 2 0 0 1-1.22.18Z"/></symbol>
  <symbol id="i-pouso" viewBox="0 0 24 24"><path d="M2 22h20"/><path d="M3.77 10.77 2 9l2-4.5 1.1.55c.55.28.9.84.9 1.45s.35 1.17.9 1.45L8 8.5l3-6 1.05.53a2 2 0 0 1 1.09 1.52l.72 5.4a2 2 0 0 0 1.09 1.52l4.4 2.2c.42.22.78.55 1.01.96l.6 1.03c.49.88-.06 1.98-1.06 2.1l-1.18.15c-.47.06-.95-.02-1.37-.24L4.29 11.15a2 2 0 0 1-.52-.38Z"/></symbol>
</svg>
<main>
  <form class="login-painel" id="form-login" hidden novalidate>
    <img class="login-logo" src="img/acpm-aguia.png" alt="ACPM">
    <h1>Painel da recepção</h1>
    <p class="h">Entre com a conta da TV (perfil Painel). Depois disso, a TV continua conectada.</p>
    <label>E-mail <input type="email" id="login-email" autocomplete="username"></label>
    <label>Senha <input type="password" id="login-senha" autocomplete="current-password"></label>
    <p class="erro-campo" id="login-erro" role="alert"></p>
    <button type="submit" class="btn" id="btn-entrar">Entrar</button>
  </form>
  <div id="quadro" hidden></div>
</main>
<script type="module" src="js/painel.js"></script>
</body>
</html>
